# Copy this file to cloudrun.env.yaml and fill in the values.
# cloudrun.env.yaml is never uploaded to GitHub or Google Cloud's build (it's ignored);
# it only sets the running service's settings.
# Keep the quotes. Use passwords with only letters and numbers.

GOOGLE_GENAI_USE_VERTEXAI: "FALSE"
GOOGLE_API_KEY: "paste-your-gemini-key"
CARE_AGENT_MODEL: "gemini-3.5-flash-lite"
CARE_AGENT_FALLBACK_MODELS: "gemini-3.1-flash-lite,gemini-3.6-flash"

# Supabase > your project > Connect > "Session pooler" URI, with your database password filled in
SESSION_DB_URI: "postgresql://postgres.xxxxxxxx:YOUR-DB-PASSWORD@aws-0-ap-south-1.pooler.supabase.com:5432/postgres"

# Everyone who opens the link must type this. Share it only with your mentor/reviewers.
DEMO_PASSWORD: "choose-a-password"

# Optional: patient emails through resend.com (see DEPLOY.md, "Patient emails")
# RESEND_API_KEY: "re_paste-your-key"
# PUBLIC_BASE_URL: "https://your-service-url"
